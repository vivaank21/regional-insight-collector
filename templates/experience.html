<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Regional Experience — Regional Insight Collector</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="experience-page">

    <div class="grid-mesh" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--one" aria-hidden="true"></div>
    <div class="glow-orb glow-orb--two" aria-hidden="true"></div>

    <main class="experience-shell">
        <div class="container">

            <p class="experience-eyebrow" id="expEyebrow">Your Regional Experience</p>

            <div class="experience-card" id="experienceCard">
                <div class="row g-0 align-items-stretch">

                    <div class="col-lg-6 experience-media">
                        <div class="media-frame" id="mediaFrame">
                            <img
                                src="{{ url_for('static', filename=data.image_path) }}"
                                alt="A regional visual representing {{ data.state }}"
                                class="regional-image"
                                id="regionalImage"
                                loading="lazy"
                            >
                        </div>
                    </div>

                    <div class="col-lg-6 experience-info">
                        <div class="info-inner">
                            <h1 class="welcome-heading" id="welcomeHeading">
                                Welcome, <span class="name-highlight">{{ data.user_name }}</span>
                            </h1>

                            <div class="location-stack" id="locationStack">
                                <p class="location-line location-city">{{ data.city }}</p>
                                <p class="location-line location-state">{{ data.state }}</p>
                                <p class="location-line location-country">{{ data.country }}</p>
                            </div>

                            <p class="experience-tagline" id="experienceTagline">
                                &ldquo;{{ data.tagline }}&rdquo;
                            </p>

                            <a href="{{ url_for('index') }}" class="btn btn-return" id="returnBtn">
                                <span aria-hidden="true">&larr;</span>&nbsp; Start over
                            </a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        document.body.dataset.page = "experience";
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
